plugins { id "com.android.application" }

// Signing key: put keystore.properties (storeFile, storePassword, keyAlias, keyPassword) next to this project.
def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) ks.load(new FileInputStream(ksFile))

android {
    namespace "com.leoghynizm.fesreport"
    compileSdk 35
    defaultConfig {
        applicationId "com.leoghynizm.fesreport"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "2.1.0"
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks["storeFile"])
                storePassword ks["storePassword"]
                keyAlias ks["keyAlias"]
                keyPassword ks["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ["html", "woff2"] }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.core:core:1.13.1"
}
